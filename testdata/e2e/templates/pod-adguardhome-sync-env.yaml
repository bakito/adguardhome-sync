{{- if and .Values.sync.enabled (eq .Values.mode "env") }}
apiVersion: v1
kind: Pod
metadata:
  name: adguardhome-sync
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: adguardhome-sync
spec:
  serviceAccountName: agh-e2e
  initContainers:
    - name: wait-for-others
      image: {{ .Values.kubectl.repository }}:{{ .Values.kubectl.tag }}
      command:
        - /bin/bash
        - -c
        - |
          {{- .Files.Get "bin/wait-for-agh-pods.sh" | nindent 10}}
  containers:
    - name: adguardhome-sync
      image: adguardhome-sync:e2e
      imagePullPolicy: IfNotPresent
      command:
        - /opt/go/adguardhome-sync
        - run
      env:
        - name: LOG_LEVEL
          value: 'debug'
      envFrom:
        - configMapRef:
            name: sync-conf
      volumeMounts:
        - name: certs
          mountPath: /certs
      livenessProbe:
        exec:
          command:
            - /opt/go/adguardhome-sync
            - healthcheck
        initialDelaySeconds: 5
        periodSeconds: 10
      readinessProbe:
        exec:
          command:
            - /opt/go/adguardhome-sync
            - healthcheck
            - --ready
        initialDelaySeconds: 5
        periodSeconds: 10
  restartPolicy: Never
  volumes:
    - name: certs
      configMap:
        name: certs
  {{- end }}
